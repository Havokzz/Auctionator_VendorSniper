<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#22303d"/>
      <stop offset="1" stop-color="#0a0f14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5c451" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f5c451" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.35" stop-color="#f4c552"/>
      <stop offset="0.8" stop-color="#c58a22"/>
      <stop offset="1" stop-color="#8f5c13"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d36c"/>
      <stop offset="1" stop-color="#d49a2c"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="150" fill="url(#glow)"/>

  <!-- reticle: ring with gaps at the four crosshair lines -->
  <circle cx="200" cy="200" r="152" fill="none" stroke="#e9c46a" stroke-width="7"
          stroke-dasharray="198.76 40" stroke-dashoffset="218.76" stroke-linecap="round"/>
  <g stroke="#e9c46a" stroke-width="7" stroke-linecap="round">
    <line x1="200" y1="22" x2="200" y2="88"/>
    <line x1="200" y1="312" x2="200" y2="378"/>
    <line x1="22" y1="200" x2="88" y2="200"/>
    <line x1="312" y1="200" x2="378" y2="200"/>
  </g>
  <g stroke="#e9c46a" stroke-width="4" stroke-linecap="round" opacity="0.7"
     transform="rotate(45 200 200)">
    <line x1="200" y1="58" x2="200" y2="74"/>
    <line x1="200" y1="326" x2="200" y2="342"/>
    <line x1="58" y1="200" x2="74" y2="200"/>
    <line x1="326" y1="200" x2="342" y2="200"/>
  </g>

  <!-- coin -->
  <circle cx="200" cy="204" r="100" fill="#4a2f08" opacity="0.6"/>
  <circle cx="200" cy="200" r="100" fill="url(#gold)"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#7d500f" stroke-width="5"/>
  <circle cx="200" cy="200" r="82" fill="url(#face)"/>
  <circle cx="200" cy="200" r="82" fill="none" stroke="#a8701a" stroke-width="4"/>
  <circle cx="200" cy="200" r="89" fill="none" stroke="#fff0b0" stroke-width="2" opacity="0.6"
          stroke-dasharray="3 6"/>

  <!-- embossed hammer -->
  <g transform="rotate(-40 200 200) translate(0 8)">
    <g fill="#fff4c8" opacity="0.7" transform="translate(-2 -2)">
      <rect x="191" y="178" width="18" height="80" rx="6"/>
      <rect x="157" y="146" width="86" height="38" rx="8"/>
    </g>
    <g fill="#7a4c0e">
      <rect x="191" y="178" width="18" height="80" rx="6"/>
      <rect x="157" y="146" width="86" height="38" rx="8"/>
    </g>
    <rect x="163" y="152" width="74" height="7" rx="3" fill="#a36a16"/>
  </g>
</svg>
