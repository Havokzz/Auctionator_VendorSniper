# Pushing a version tag (for example v1.0.1) builds the add-on zip and uploads it to CurseForge
# (project ID from the TOC's X-Curse-Project-ID) and to a GitHub release, using the BigWigs packager.
# Needs the repository secret CF_API_KEY: a CurseForge API token.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # to create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager looks back through history for the previous tag

      # Release notes = this version's section of CHANGELOG.md ("## 1.0.1" for tag v1.0.1), not the whole file.
      # Falls back to the whole file if there's no section for this version.
      - name: Release notes for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '$0 == heading { found = 1; next } /^## / { if (found) exit } found'             CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then cp CHANGELOG.md RELEASE_NOTES.md; fi
          cat RELEASE_NOTES.md

      - uses: BigWigsMods/packager@v2
        with:
          # name files and uploads after the tag alone, without the default "-forever" suffix
          args: -n "{package-name}-{project-version}:{project-version}"
